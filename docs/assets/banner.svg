<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Center Soft Radial Glow -->
    <radialGradient id="center-glow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="light-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#E2E8F0" stroke-width="0.85" />
    </pattern>

    <!-- Icon Squircle Gradient -->
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>

    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1E3A8A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="440" fill="#FFFFFF" />

  <!-- Outer Rounded Card Container -->
  <g filter="url(#card-shadow)">
    <rect x="24" y="24" width="1152" height="392" rx="28" fill="url(#bg-canvas)" stroke="#CBD5E1" stroke-width="1.2" />
  </g>

  <!-- Blueprint Technical Grid -->
  <rect x="25" y="25" width="1150" height="390" rx="27" fill="url(#light-grid)" />

  <!-- Ambient Radial Aura -->
  <rect x="25" y="25" width="1150" height="390" rx="27" fill="url(#center-glow)" />

  <!-- ========================================================================= -->
  <!-- CENTER BRAND CONTENT                                                      -->
  <!-- ========================================================================= -->

  <!-- Icon: Glowing Squircle with Shield & Keyhole -->
  <g transform="translate(600, 115)">
    <!-- Squircle Background -->
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="url(#icon-grad)" filter="url(#icon-shadow)" />

    <!-- Inner Shield Icon -->
    <g transform="translate(0, -1)">
      <!-- Shield Path -->
      <path d="M 0 -24 L 21 -14 C 21 12 11 26 0 31 C -11 26 -21 12 -21 -14 Z" 
            fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
      
      <!-- Vault Keyhole / Lock Center -->
      <circle cx="0" cy="1" r="5" fill="#FFFFFF" />
      <path d="M -2.5 4 L -3.5 12 L 3.5 12 L 2.5 4 Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Project Name: ENTROPYX -->
  <g transform="translate(600, 218)">
    <text text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" letter-spacing="1">
      <tspan fill="#0F172A">ENTROPY</tspan><tspan fill="#2563EB">X</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 252)">
    <text text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="500" fill="#475569" letter-spacing="0.2">
      Intelligent Cryptographic Suite &amp; Zero-Knowledge Vault for Windows &amp; Cloud
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM PILL BADGES ROW                                                    -->
  <!-- ========================================================================= -->
  <g transform="translate(600, 318)">
    <!-- Pill 1: Real-Time CSPRNG (x = -490) -->
    <g transform="translate(-490, 0)">
      <rect width="180" height="38" rx="19" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2" />
      <path d="M 22 19 L 27 12 L 24 19 L 29 19 L 23 27 L 25 21 Z" fill="#2563EB" />
      <text x="36" y="24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1D4ED8">
        C++14 OS CSPRNG
      </text>
    </g>

    <!-- Pill 2: 100% Offline & Private (x = -294) -->
    <g transform="translate(-294, 0)">
      <rect width="184" height="38" rx="19" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2" />
      <g transform="translate(20, 11)">
        <rect x="1" y="6" width="12" height="9" rx="2" fill="#059669" />
        <path d="M 4 6 L 4 4 C 4 2.5 5 1.5 7 1.5 C 9 1.5 10 2.5 10 4 L 10 6" fill="none" stroke="#059669" stroke-width="1.5" />
      </g>
      <text x="40" y="24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#047857">
        100% Zero-Knowledge
      </text>
    </g>

    <!-- Pill 3: Zero Modulo Bias (x = -94) -->
    <g transform="translate(-94, 0)">
      <rect width="188" height="38" rx="19" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1.2" />
      <circle cx="26" cy="19" r="6" fill="none" stroke="#7C3AED" stroke-width="1.8" />
      <circle cx="26" cy="19" r="2" fill="#7C3AED" />
      <text x="38" y="24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#6D28D9">
        Zero Modulo Bias
      </text>
    </g>

    <!-- Pill 4: 2M-Bit Bloom Filter (x = 110) -->
    <g transform="translate(110, 0)">
      <rect width="184" height="38" rx="19" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2" />
      <path d="M 18 14 L 28 14 L 24 20 L 24 24 L 22 24 L 22 20 Z" fill="#0284C7" />
      <text x="36" y="24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0369A1">
        2M-Bit Bloom Filter
      </text>
    </g>

    <!-- Pill 5: Volatile RAM Auto-Lock (x = 310) -->
    <g transform="translate(310, 0)">
      <rect width="180" height="38" rx="19" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2" />
      <g transform="translate(18, 11)">
        <path d="M 10 2 C 7 3 4 6 3 9 C 3 11 4 12 5 12 L 8 9 L 11 12 C 11 13 12 14 14 14 C 14 12 13 10 12 9 C 13 6 12 3 10 2 Z" fill="#4F46E5" />
        <circle cx="9" cy="6" r="1.5" fill="#FFFFFF" />
      </g>
      <text x="38" y="24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#4338CA">
        Instant RAM Wipe
      </text>
    </g>
  </g>
</svg>
